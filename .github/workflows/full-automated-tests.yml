name: Full Automated Tests

on:
  push:
    branches:
      - fca-migration-cleanup
  pull_request:
    branches:
      - main
      - fca-migration-cleanup
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goatbot-full-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automated-tests:
    name: Unit, integration and runtime checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Run complete automated test suite
        run: node --test agent-bridge/*.test.js bot/login/*.test.js test/*.test.js

      - name: Syntax-check FCA integration entry points
        run: |
          node --check bot/login/fcaProvider.js
          node --check bot/login/login.js
          node --check bot/login/secureSession.js
          node --check bot/login/humanizerOptions.js
          node --check agent-bridge/runtime.js
          node --check agent-bridge/worker.js

      - name: Verify OmegA-FCA stable-latest dependency declaration
        run: |
          node <<'NODE'
          const p = require('./package.json');
          const dependency = p.dependencies?.['@nirzon-islam/omega-fca'];
          if (dependency !== 'latest') {
            throw new Error(`Expected @nirzon-islam/omega-fca dependency to be latest, got ${dependency}`);
          }
          for (const scriptName of ['prestart', 'predev', 'preprod']) {
            const script = p.scripts?.[scriptName] || '';
            if (!script.includes('@nirzon-islam/omega-fca@latest')) {
              throw new Error(`${scriptName} must install @nirzon-islam/omega-fca@latest`);
            }
          }
          console.log('OmegA-FCA stable-latest dependency and startup installers OK');
          NODE
