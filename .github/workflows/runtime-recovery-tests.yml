name: Runtime recovery tests

on:
  push:
    branches:
      - fix/facebook-session-monitor
      - fca-migration-cleanup
    paths:
      - "bot/login/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/runtime-recovery-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "bot/login/**"
      - "package.json"
      - "package-lock.json"

jobs:
  secure-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - run: npm run test:secure-session
      - run: npm run test:fca-provider
      - run: node --check bot/login/fcaProvider.js
      - run: node --check bot/login/login.js
      - run: node --check agent-bridge/worker.js
