name: Runtime recovery tests

on:
  push:
    branches:
      - fix/facebook-session-monitor
      - fca-migration-cleanup
    paths:
      - "bot/login/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/runtime-recovery-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "bot/login/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"

permissions:
  contents: read

jobs:
  secure-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run test:secure-session
      - run: node --check bot/login/login.js
      - run: node --check bot/login/omegaFca.js
      - run: node -e "const login = require('./bot/login/omegaFca'); if (typeof login !== 'function') process.exit(1)"
      - run: node --check agent-bridge/worker.js
