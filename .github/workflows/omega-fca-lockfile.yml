name: One-time npm lockfile generation
on:
  push:
    branches:
      - fca-migration-cleanup
    paths:
      - .github/workflows/omega-fca-lockfile.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fca-migration-cleanup
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Generate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile consistency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/omega-fca-lockfile.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore(fca): regenerate npm lockfile for 0.2.3-beta.1"
            git push origin HEAD:fca-migration-cleanup
          fi
